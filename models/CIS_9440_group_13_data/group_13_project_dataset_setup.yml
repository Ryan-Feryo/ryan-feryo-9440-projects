name: 'nyc_analytics'
version: '1.0.0'
config-version: 2
# Some default settings for dbt
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
 - "target"
 - "dbt_packages"

# Set up models, which are basically SQL files, to create tables
models:
  nyc_analytics:
    +materialized: table

    staging:
      +schema: group_13_project_staging

    DOHMH_RIR:
      +schema: group_13_warehouse_marts

    NYC_311_complaints:
      +schema: group_13_warehouse_marts

  